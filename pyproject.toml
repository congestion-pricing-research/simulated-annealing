[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "cordon-annealing"
version = "0.1.0"
description = "Simulated annealing of a connected, hole-free toll cordon using OD demand"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "numpy>=1.26",
  "networkx>=3.0",
  "shapely>=2.0",
  "matplotlib>=3.8",
]

[project.optional-dependencies]
sf = ["pandas>=2.0", "geopandas>=1.0", "scipy>=1.10", "tqdm>=4.0"]
dev = ["pytest>=8.0", "nbformat>=5.0"]

[project.scripts]
cordon-annealing = "cordon_annealing.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
cordon_annealing = ["data/sf_start.csv"]

[tool.pytest.ini_options]
testpaths = ["tests"]
